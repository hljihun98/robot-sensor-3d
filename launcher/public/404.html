<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>페이지 없음 · 센서 3D 이력관리</title>
  <script>
    // GitHub Pages: 센서로그 웹 데모의 화면 주소(/platform/robot/18 등)로 바로 들어오면 데모 시작 화면을 거쳐 그 주소로 보낸다
    (function () {
      var repo = '/' + location.pathname.split('/')[1];
      var demo = repo + '/platform/';
      if (location.pathname.indexOf(demo) === 0 && location.pathname !== demo) {
        location.replace(demo + '?to=' + encodeURIComponent(location.pathname + location.search + location.hash));
      }
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #f4f6f8; color: #17202a;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; }
    @media (prefers-color-scheme: dark) { body { background: #0e1419; color: #e6edf3; } a { color: #5fb8d1; } }
    a { color: #155e75; }
  </style>
</head>
<body>
  <p>페이지를 찾을 수 없습니다. <a href="/robot-sensor-3d/" id="home">홈페이지로 가기</a></p>
  <script>document.getElementById('home').href = '/' + location.pathname.split('/')[1] + '/';</script>
</body>
</html>
