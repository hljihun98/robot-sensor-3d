# main에 올리면 실행 관리 홈페이지와 두 프로그램의 웹 데모를 GitHub Pages로 배포합니다.
#   https://<계정>.github.io/robot-sensor-3d/           → 홈페이지(온라인 모드)
#   https://<계정>.github.io/robot-sensor-3d/damage/    → damage 데모(화면 코드의 데모 모드)
#   https://<계정>.github.io/robot-sensor-3d/platform/  → 센서로그 웹 데모(서버 코드를 브라우저 서비스 워커에서 실행)
name: 홈페이지 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: robot-sensor-platform/package-lock.json
      - name: 홈페이지·damage 데모 모으기
        run: |
          mkdir -p _site/damage
          cp -r launcher/public/. _site/
          cp -r robot-sensor-damage/public/. _site/damage/
          touch _site/.nojekyll
      - name: 센서로그 웹 데모 빌드
        working-directory: robot-sensor-platform
        run: |
          npm ci --no-audit --no-fund
          npm run build:web -- ../_site/platform
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
